name: Feature request
description: Propose a feature or enhancement
labels: ["type: feature", "priority: medium", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. The toolkit's scope is "AI Readiness for Astro sites" — generating agent-readable artifacts (llms.txt, agents.md, robots.txt, mcp.json) and JSON-LD helpers at build time. Features outside that scope will be politely closed.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem or workflow does this feature unblock? Be specific — "I want to do X but the toolkit doesn't let me" is more useful than "it would be cool if…".
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: What would the API / output look like? Sketch a concrete `astro.config.mjs` excerpt or component usage.
      render: markdown
      placeholder: |
        ```ts
        // astro.config.mjs
        aiReadiness({
          // proposed config shape
        })
        ```

        ```astro
        ---
        // proposed component usage
        ---
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you tried existing approaches? Other Astro integrations? Custom build scripts? What didn't work, and why?
    validations:
      required: true

  - type: textarea
    id: scope-check
    attributes:
      label: Scope fit
      description: |
        The toolkit generates AI-readiness artifacts for Astro sites at build time — llms.txt, agents.md, robots.txt, .well-known/mcp.json, and JSON-LD components. How does your request fit that scope? Adjacent niceties (Lighthouse tuning, OG image generation, sitemap depth) are generally out of scope.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Links, related issues, prior art in the Astro ecosystem.
    validations:
      required: false
