name: Bug report
description: Report a bug in @obaronai/astro-ai-readiness
labels: ["type: bug", "priority: medium", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in the fields below — the more detail, the faster we can reproduce and fix.

  - type: input
    id: package-version
    attributes:
      label: Package version
      description: Output of `npm ls @obaronai/astro-ai-readiness` in the consumer project.
      placeholder: "0.0.1"
    validations:
      required: true

  - type: input
    id: astro-version
    attributes:
      label: Astro version
      description: From `package.json` `dependencies.astro` or `npm ls astro`.
      placeholder: "5.5.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: "v22.11.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.3 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal `astro.config.mjs` excerpt + the Astro page or layout that reproduces the issue. A link to a public minimal-reproduction repo (e.g., on StackBlitz) is even better.
      render: markdown
      placeholder: |
        1. Install `@obaronai/astro-ai-readiness@0.0.1`
        2. Configure with `aiReadiness({ ... })` as below:

        ```ts
        // astro.config.mjs excerpt
        ```

        3. Build with `npm run build`
        4. Inspect `dist/index.html`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What output or behavior did you expect?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages, generated file content (or absence), or links to a deployed site.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else useful — links to your site, related issues, etc.
    validations:
      required: false
