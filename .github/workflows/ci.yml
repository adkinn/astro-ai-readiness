name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        astro: [5.18.0, 6.4.8, 7.2.9]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - run: npm ci

      - name: Test against Astro ${{ matrix.astro }}
        run: npm install --no-save --package-lock=false astro@${{ matrix.astro }}

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
