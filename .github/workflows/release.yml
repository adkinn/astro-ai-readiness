name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1. Node 24
          # bundles npm 11.x; the explicit upgrade below removes any doubt.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache in a release build — the tarball that gets
          # signed should be built from a clean install, not a restored one.
          package-manager-cache: false

      - name: Use an npm that speaks OIDC
        run: npm install -g npm@latest

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Full gate before publish — a tag on a broken commit can't ship to npm.
      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # NB: hardcoded artifact list. When src/components/ adds a new
      # component (or src/ adds a new dist entry), append the new
      # expected file paths here — otherwise the new artifact ships
      # unverified. Tracked as a trigger in CHANGELOG / docs/maintainer-setup.md.
      - name: Verify dist is non-empty
        run: |
          for f in dist/index.js dist/index.d.ts \
                   dist/components/index.js dist/components/index.d.ts \
                   dist/components/OrganizationSchema.astro \
                   dist/components/PersonSchema.astro \
                   dist/components/SoftwareApplicationSchema.astro; do
            if [ ! -s "$f" ]; then
              echo "::error::expected build artifact missing or empty: $f"
              exit 1
            fi
          done

      # Authenticated by OIDC trusted publishing — no npm token anywhere in
      # this workflow. npm generates the provenance attestation automatically
      # for a public package from a public repo, so `--provenance` is implied.
      #
      # Idempotent: skip if this version is already on npm, so re-tagging an
      # already-published version (or re-running the job) never false-fails.
      - name: Publish to npm (skip if version already published)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@adkinn/astro-ai-readiness@${VERSION}" version >/dev/null 2>&1; then
            echo "@adkinn/astro-ai-readiness@${VERSION} is already published — skipping publish."
          else
            npm publish --access public
          fi
