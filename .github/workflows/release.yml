name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # active LTS at publish time — bump when Node's LTS line advances
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Full gate before publish — a tag on a broken commit can't ship to npm.
      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # NB: hardcoded artifact list. When src/components/ adds a new
      # component (or src/ adds a new dist entry), append the new
      # expected file paths here — otherwise the new artifact ships
      # unverified. Tracked as a trigger in CHANGELOG / docs/maintainer-setup.md.
      - name: Verify dist is non-empty
        run: |
          for f in dist/index.js dist/index.d.ts \
                   dist/components/index.js dist/components/index.d.ts \
                   dist/components/OrganizationSchema.astro; do
            if [ ! -s "$f" ]; then
              echo "::error::expected build artifact missing or empty: $f"
              exit 1
            fi
          done

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
